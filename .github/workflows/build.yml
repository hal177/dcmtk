name: Build

on:
  push:
    branches:
      - 3.7.0
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Which revision of the shared build scripts to use. build.sh names the
  # same ref in COMMON_REF for local runs; keep the two in step.
  COMMON_REF: packaging

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hal177/thirdparty:base-2404
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write   # create releases
      packages: read

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Shared build and packaging scripts (common.bash, packaging.bash).
      - name: Checkout common scripts
        uses: actions/checkout@v4
        with:
          repository: hal177/thirdparty
          ref: ${{ env.COMMON_REF }}
          path: common
          token: ${{ secrets.THIRDPARTY_READONLY_TOKEN }}
          fetch-depth: 1

      # In a container job the checked-out workspace is owned by a different
      # uid than the container's root user, so git refuses to read it
      # ("dubious ownership") and the package version lookup (git rev-parse
      # HEAD, in packaging.bash) fails. Trust it explicitly.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory '*'

      #**********************************************************************
      - name: Build and package
        run: ./build.sh
        timeout-minutes: 60
      #**********************************************************************

      # upload-artifact@v4 runs from the VM, not the container, so the
      # files must live under the shared workspace.
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: pulmera-dcmtk-debs
          path: dist/*.deb
          if-no-files-found: error

      # Publish the .debs to a Release tagged v<version>, the durable place
      # the image builds and developers pull them from (the artifact above
      # is only kept ~90 days). Runs only for a real version branch build.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.ref_name }}
          name: pulmera-dcmtk ${{ github.ref_name }}
          files: dist/*.deb
          fail_on_unmatched_files: true
